<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Milky Way</title>
    <meta name="description" content="Fly through our galaxy, find the Sun, and visit every planet. An interactive 3D model of the Milky Way.">
    <link rel="canonical" href="https://milkyway.dknia.my.id/">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">

    <!-- Link previews (WhatsApp, Telegram, Facebook, X, LinkedIn, Slack) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Milky Way">
    <meta property="og:title" content="The Milky Way">
    <meta property="og:description" content="Fly through our galaxy, find the Sun, and visit every planet.">
    <meta property="og:url" content="https://milkyway.dknia.my.id/">
    <meta property="og:image" content="https://milkyway.dknia.my.id/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A spiral galaxy seen at an angle, with the title The Milky Way">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Milky Way">
    <meta name="twitter:description" content="Fly through our galaxy, find the Sun, and visit every planet.">
    <meta name="twitter:image" content="https://milkyway.dknia.my.id/og-image.jpg">

    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
</head>

<body>
    <canvas id="galaxyCanvas" aria-label="3D model of the Milky Way galaxy"></canvas>

    <div id="labels" aria-hidden="true"></div>

    <header class="intro">
        <h1>The Milky Way</h1>
        <p>Our galaxy, about 100,000 light-years across. The Sun sits in a small spur of stars, 26,000 light-years from the center.</p>
    </header>

    <nav class="views" aria-label="Views">
        <button type="button" data-view="overview" aria-pressed="true">Overview</button>
        <button type="button" data-view="face">Face-on</button>
        <button type="button" data-view="edge">Edge-on</button>
        <button type="button" data-view="sun">Find the Sun</button>
        <button type="button" id="toggleLabels" aria-pressed="true">Labels</button>
    </nav>

    <footer class="readout">
        <div class="scale" aria-live="polite">
            <span class="scale-bar" id="scaleBar"></span>
            <span id="scaleText">10,000 light-years</span>
        </div>
        <p class="hint" id="hint">Drag to orbit. Scroll or pinch to zoom.</p>
    </footer>

    <aside class="info" id="info" aria-labelledby="infoTitle" hidden>
        <button type="button" class="info-close" id="infoClose" aria-label="Close">&times;</button>
        <h2 id="infoTitle"></h2>
        <p class="info-kind" id="infoKind"></p>
        <p class="info-text" id="infoText"></p>
        <dl class="info-facts" id="infoFacts"></dl>
        <a class="info-link" id="infoLink" target="_blank" rel="noopener noreferrer" hidden></a>
    </aside>

    <a class="credit" href="https://github.com/sai-educ/Milky-Way-3D-Simulator">Based on Milky Way 3D Simulator by sai-educ</a>

    <div id="loading" role="status">Gathering stars</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.153.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.153.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js?v=17"></script>
</body>

</html>
